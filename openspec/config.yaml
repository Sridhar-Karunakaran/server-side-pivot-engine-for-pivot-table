schema: bugfix-feature

# Project context (optional)
# Add only constraints that should guide OpenSpec artifacts and workflows.
# Include constraints an agent cannot infer by reading the code.
# Keep general project documentation and discoverable codebase facts out.
context: |
  Use OpenSpec for every bug fix and feature implementation in this repository.
  The default schema is bugfix-feature. Create each change with
  `openspec new change "<name>"` so `.openspec.yaml` is generated by the CLI.
  Do not hand-create change directories.
  Every bug fix and feature change must produce all of these artifacts before
  implementation starts: EXPLORATION.md, proposal.md, design.md, tasks.md,
  one delta spec per declared capability, and `.openspec.yaml`.
  The server is the ASP.NET Core project in PivotController (net10.0). The
  browser sample lives in Sample and must keep working with the existing
  pivot endpoint contract. Do not change public request or response shapes
  unless the change explicitly says so.
  Planning workflows stop after the artifacts. Implementation starts only when
  the user starts the apply workflow.

# Per-artifact rules (optional)
# Add custom rules for specific artifacts.
rules:
  exploration:
    - Always write EXPLORATION.md for both bug fixes and features
    - Set Change type to bug-fix or feature
    - Cite inspected repository paths; do not invent runtime behavior
  proposal:
    - State whether the change is a bug fix or a feature
    - Stay consistent with EXPLORATION.md
    - Declare at least one capability unless .openspec.yaml sets skip_specs true
  specs:
    - Use SHALL or MUST and give every requirement at least one scenario
    - Scenarios must use exactly four hashtags
  design:
    - Follow the recommended approach in EXPLORATION.md or explain the divergence
    - Name affected PivotController or Sample files
  tasks:
    - Include a verification task that covers the reproduction or integration evidence from EXPLORATION.md
    - Keep each tracked task as a checkbox

# Per-operation guidance (optional)
# Add advisory guidance for how apply and archive work should be conducted.
# This is separate from artifact rules above.
operations:
  apply:
    guidance:
      - Do not start until EXPLORATION.md, proposal.md, design.md, tasks.md, and .openspec.yaml exist
      - Verify the fix or feature against the evidence recorded in EXPLORATION.md
  archive:
    guidance:
      - Archive only after the tasks are complete and the change validates
