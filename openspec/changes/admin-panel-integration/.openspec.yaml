created_at: 2026-10-23
notes: |
  Phase 2 companion to the MAUI Admin Panel change `maui-admin-panel`
  (syncfusion-maui-data-server-admin-panel repository). This change specifies
  ONLY the backend work the panel requires: D1 panel-config precedence
  bootstrap, D2 POST /api/config/import (REPLACE semantics), D3 multi-user
  security store + CRUD + BasicAuth against it (deprecating
  Security.Authorization), D4 GET /api/monitoring, D5 GET /api/diagnostics/logs,
  D6 credential hygiene (normative). All existing REST contracts for the
  already-implemented settings/index/pivot endpoints remain unchanged.