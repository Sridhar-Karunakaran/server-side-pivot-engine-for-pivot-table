id: dotnet-blazor
name: Blazor (Server, WebAssembly, Web App)
extends: dotnet-common
catalog: catalogs/defects-blazor.md

detect:
  requires:
    - glob: "**/*.csproj"
  signals:
    - kind: packageRef
      value: Microsoft.AspNetCore.Components.Web
      weight: 10
    - kind: packageRef
      value: Microsoft.AspNetCore.Components.WebAssembly
      weight: 10
    - kind: glob
      value: "**/*.razor"
      weight: 8
    - kind: glob
      value: "**/_Imports.razor"
      weight: 6
    - kind: packageRef
      value: Syncfusion.Blazor
      weight: 4
  excludes:
    - packageRef: Microsoft.Maui.Controls

runtime:
  buildCommand: dotnet build
  testCommand: dotnet test
  uiTestFramework: bunit
  browserTestFramework: playwright

knowledge:
  - id: blazor-lifecycle
    url: https://learn.microsoft.com/aspnet/core/blazor/components/lifecycle
    topics: [lifecycle, OnInitializedAsync, disposal, prerender]
    required: true
  - id: blazor-render-modes
    url: https://learn.microsoft.com/aspnet/core/blazor/components/render-modes
    topics: [render-modes, interactivity, prerendering]
    required: true
  - id: blazor-js-interop
    url: https://learn.microsoft.com/aspnet/core/blazor/javascript-interoperability/
    topics: [interop, DotNetObjectReference, disposal]
    required: true
  - id: blazor-performance
    url: https://learn.microsoft.com/aspnet/core/blazor/performance
    topics: [rendering, key, ShouldRender, virtualization]
    required: true
  - id: bunit-docs
    url: https://bunit.dev/docs/getting-started/
    topics: [component-testing]
    required: false

mcp:
  - id: microsoft-docs
    why: "authoritative Blazor and .NET API lookups instead of model recall"
    optional: true

gates:
  - id: component-tests
    tier: L1
    lane: inner
    claim: "Blazor components render and behave as specified"
    tool: bunit
    license: "MIT (free, commercial use OK)"
    command: dotnet test --nologo --filter Category=Component --logger "trx;LogFileName={EVIDENCE_DIR}/bunit.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/bunit.trx"
    threshold: failed == 0
    blocking: true
    installHint: "add the bunit and bunit.xunit packages to a test project"
    docs: https://bunit.dev/
    rationale: >
      Razor markup is the part an agent is most likely to get subtly wrong
      (@key, EventCallback wiring, conditional render). bUnit makes those
      testable without a browser.

  - id: leak-web
    tier: L3
    lane: outer
    claim: "no retained components or detached DOM on the changed route"
    tool: memlab
    license: "MIT (free, commercial use OK)"
    command: npx memlab run --scenario e2e/leak/{SCENARIO}.js --work-dir {EVIDENCE_DIR}/memlab
    parser: memlab
    evidence: "{EVIDENCE_DIR}/memlab/leaks.json"
    threshold: leaks == 0
    blocking: true
    installHint: "npm i -D memlab  (needs a running app URL)"
    docs: https://facebook.github.io/memlab/
    rationale: >
      Blazor's dominant leak is an undisposed DotNetObjectReference or an
      un-unsubscribed event. Neither is visible in source review; both are
      visible in a heap snapshot.

  - id: a11y
    tier: L3
    lane: outer
    claim: "no WCAG A/AA violations on changed pages"
    tool: axe-core
    license: "MPL-2.0 (free, commercial use OK)"
    command: npx playwright test --grep @a11y --reporter=junit
    parser: junit
    evidence: "{EVIDENCE_DIR}/a11y-junit.xml"
    threshold: failed == 0
    blocking: false
    installHint: "npm i -D @axe-core/playwright"
    docs: https://github.com/dequelabs/axe-core-npm
    rationale: "Accessibility is measurable; do not let it be asserted."
