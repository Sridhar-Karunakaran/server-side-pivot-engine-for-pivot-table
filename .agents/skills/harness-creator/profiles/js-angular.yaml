id: js-angular
name: Angular
extends: js-common
catalog: catalogs/defects-angular.md

detect:
  requires:
    - glob: "package.json"
  signals:
    - kind: packageRef
      value: "@angular/core"
      weight: 10
    - kind: glob
      value: "angular.json"
      weight: 9
    - kind: packageRef
      value: "@angular/cli"
      weight: 5
    - kind: packageRef
      value: "@syncfusion/ej2-angular-grids"
      weight: 4
  excludes:
    - packageRef: react

runtime:
  buildCommand: npx ng build
  testCommand: npx ng test --watch=false
  generates:
    - eslint.config.js

knowledge:
  - id: angular-style-guide
    url: https://angular.dev/style-guide
    topics: [naming, structure, conventions]
    required: true
  - id: angular-best-practices
    url: https://angular.dev/best-practices
    topics: [performance, security, accessibility]
    required: true
  - id: angular-change-detection
    url: https://angular.dev/best-practices/runtime-performance
    topics: [OnPush, zone, change-detection]
    required: true
  - id: angular-signals
    url: https://angular.dev/guide/signals
    topics: [signals, reactivity]
    required: true
  - id: angular-security
    url: https://angular.dev/best-practices/security
    topics: [XSS, sanitization, bypassSecurityTrust]
    required: true
  - id: rxjs-operators
    url: https://rxjs.dev/guide/operators
    topics: [operators, subscription-management]
    required: true
  - id: angular-eslint-rules
    url: https://github.com/angular-eslint/angular-eslint/blob/main/packages/eslint-plugin/README.md
    topics: [lint-rules, rule-ids]
    required: true

mcp:
  - id: angular-cli-mcp
    why: "Angular CLI ships an MCP server exposing schematics and version-correct docs"
    optional: true
    setup: "npx ng mcp"

skills:
  - id: angular-development
    optional: true

gates:
  - id: lint
    tier: L0
    lane: inner
    claim: "no ESLint errors, with angular-eslint template and a11y rules enabled"
    tool: angular-eslint
    license: "MIT (free, commercial use OK)"
    command: npx ng lint --format json --force > {EVIDENCE_DIR}/eslint.json
    parser: eslint-json
    evidence: "{EVIDENCE_DIR}/eslint.json"
    threshold: errors == 0
    blocking: true
    ratchet: true
    installHint: "npx ng add @angular-eslint/schematics"
    docs: https://github.com/angular-eslint/angular-eslint
    rationale: >
      The template rules are the point. use-track-by-function,
      prefer-on-push-component-change-detection, click-events-have-key-events and
      the rxjs takeuntil rules each convert a whole defect class from a review
      item into a build failure. Most repos have angular-eslint installed with
      these rules off.

  - id: tests
    tier: L1
    lane: inner
    claim: "the test suite passes"
    tool: karma-or-vitest
    license: "MIT (free, commercial use OK)"
    command: npx ng test --watch=false --reporters=junit --browsers=ChromeHeadless
    parser: junit
    evidence: "{EVIDENCE_DIR}/junit.xml"
    threshold: failed == 0
    blocking: true
    docs: https://angular.dev/guide/testing
    rationale: "Angular CLI's runner rather than raw vitest, so TestBed works."

  - id: bundle-budget
    tier: L1
    lane: inner
    claim: "bundle size is within the angular.json budget"
    tool: angular-cli
    license: "MIT (free, commercial use OK)"
    command: npx ng build --configuration production
    parser: exitcode
    threshold: exit == 0
    blocking: true
    docs: https://angular.dev/reference/configs/workspace-config#size-budgets
    rationale: >
      Angular CLI has budgets built in - no extra tool needed. Set them in
      angular.json and the build fails on a regression. This is the gate that
      catches a barrel import of an entire component library.
