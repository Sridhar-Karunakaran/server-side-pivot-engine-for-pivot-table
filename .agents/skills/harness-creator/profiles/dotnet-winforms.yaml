id: dotnet-winforms
name: Windows Forms
extends: dotnet-common
catalog: catalogs/defects-dotnet-ui.md

detect:
  requires:
    - glob: "**/*.csproj"
  signals:
    - kind: fileContains
      value: "**/*.csproj::<UseWindowsForms>true</UseWindowsForms>"
      weight: 10
    - kind: glob
      value: "**/*.Designer.cs"
      weight: 7
    - kind: fileContains
      value: "**/*.cs::System\\.Windows\\.Forms"
      weight: 6
    - kind: packageRef
      value: Syncfusion.SfDataGrid.WinForms
      weight: 4

runtime:
  buildCommand: dotnet build
  testCommand: dotnet test
  note: >
    WinForms codebases are usually old and large. Expect to start at L0 or L1 and
    scope the analyzer gate to changed projects only - see the brownfield
    sequence in references/roslyn-enforcement.md.

knowledge:
  - id: winforms-dispose
    url: https://learn.microsoft.com/dotnet/desktop/winforms/controls/dispose-of-resources
    topics: [disposal, GDI, handles]
    required: true
  - id: ca2000
    url: https://learn.microsoft.com/dotnet/fundamentals/code-analysis/quality-rules/ca2000
    topics: [disposal, scope]
    required: true
  - id: winforms-threading
    url: https://learn.microsoft.com/dotnet/desktop/winforms/controls/how-to-make-thread-safe-calls-to-windows-forms-controls
    topics: [threading, Invoke, cross-thread]
    required: true

gates:
  - id: analyzers
    tier: L0
    lane: inner
    claim: "no Roslyn analyzer violations, with disposal rules as errors"
    tool: dotnet-analyzers
    license: "MIT in-SDK; StyleCop MIT; SonarAnalyzer LGPL-3.0"
    command: dotnet build --nologo -v:n /p:EnforceCodeStyleInBuild=true
    parser: msbuild
    threshold: errors == 0
    blocking: true
    ratchet: true
    docs: https://learn.microsoft.com/dotnet/fundamentals/code-analysis/quality-rules/ca2000
    rationale: >
      CA2000/CA2213/CA1001 at error severity is the single highest-value setting
      for WinForms: GDI handle exhaustion from undisposed Graphics, Font, Brush
      and Pen is the defect that actually kills these applications, and it is
      fully machine-detectable. Threshold is errors-only because legacy WinForms
      warning counts are in the thousands - ratchet them down over time.

  - id: leak-controls
    tier: L1
    lane: inner
    claim: "forms and controls are collected after close"
    tool: xunit
    license: "MIT (free, commercial use OK)"
    command: dotnet test --nologo --filter Category=Leak --logger "trx;LogFileName={EVIDENCE_DIR}/leak.trx"
    parser: trx
    evidence: "{EVIDENCE_DIR}/leak.trx"
    threshold: failed == 0
    blocking: true
    docs: https://learn.microsoft.com/dotnet/desktop/winforms/
    rationale: >
      WeakReference-after-dispose tests catch event-handler retention, the most
      common WinForms leak after GDI objects.

  - id: banned-api
    tier: L2
    lane: inner
    claim: "no banned legacy APIs are used"
    tool: banned-api-analyzers
    license: "MIT (free, commercial use OK)"
    command: dotnet build --nologo -v:n
    parser: msbuild
    threshold: errors == 0
    blocking: true
    installHint: "add Microsoft.CodeAnalysis.BannedApiAnalyzers and a BannedSymbols.txt"
    docs: https://github.com/dotnet/roslyn-analyzers/blob/main/src/Microsoft.CodeAnalysis.BannedApiAnalyzers/BannedApiAnalyzers.Help.md
    rationale: >
      The only reliable way to stop an agent reaching for Application.DoEvents,
      DateTime.Now, or a deprecated internal API. You author the error message.
