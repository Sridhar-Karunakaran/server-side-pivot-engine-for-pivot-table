id: js-common
name: JavaScript / TypeScript (shared base)
catalog: catalogs/defects-react.md

detect:
  requires:
    - glob: "package.json"
  signals:
    - kind: glob
      value: "tsconfig.json"
      weight: 4

runtime:
  buildCommand: npm run build
  testCommand: npm test
  generates:
    - eslint.config.js
    - .size-limit.json

knowledge:
  - id: typescript-handbook
    url: https://www.typescriptlang.org/docs/handbook/intro.html
    topics: [types, narrowing, generics]
    required: true
  - id: typescript-eslint-rules
    url: https://typescript-eslint.io/rules/
    topics: [lint-rules, rule-ids]
    required: true

gates:
  - id: harness-verify
    tier: L0
    lane: inner
    claim: "the control plane matches HARNESS-LOCK.json and every cross-reference resolves"
    tool: harness
    license: "n/a (generated)"
    command: python3 .agent/tools/harness.py verify
    parser: exitcode
    threshold: exit == 0
    blocking: true
    docs: references/control-plane.md
    rationale: >
      Without this gate the control plane is advisory. Thresholds are protected by the
      ratchet floor, but a policy, workflow or agent definition is just a markdown file
      an agent can edit - and relaxing a policy is cheaper than satisfying it. This
      hashes every control-plane file and fails the build on any unreviewed change,
      dangling cross-reference, orphan, or unroutable task type.
  - id: typecheck
    tier: L0
    lane: inner
    claim: "the project type-checks with no errors"
    tool: typescript
    license: "Apache-2.0 (free, commercial use OK)"
    command: npx tsc --noEmit
    parser: exitcode
    threshold: exit == 0
    blocking: true
    installHint: "npm i -D typescript"
    docs: https://www.typescriptlang.org/tsconfig
    rationale: >
      With strict mode on, this is the cheapest and highest-yield gate for
      AI-generated TypeScript. Confirm strict is actually enabled - it is
      routinely off in older repos, which silently voids most of this gate.

  - id: lint
    tier: L0
    lane: inner
    claim: "no ESLint errors"
    tool: eslint
    license: "MIT (free, commercial use OK)"
    command: npx eslint . --format json --output-file {EVIDENCE_DIR}/eslint.json
    parser: eslint-json
    evidence: "{EVIDENCE_DIR}/eslint.json"
    threshold: errors == 0
    blocking: true
    ratchet: true
    installHint: "npm i -D eslint"
    docs: https://eslint.org/docs/latest/
    rationale: >
      The eslint-json parser reports per-rule counts, so the reviewer targets
      rule ids. It also makes eslint-disable comments in a diff visible, which
      is the most common way an agent evades a hooks or typing rule.

  - id: build
    tier: L0
    lane: inner
    claim: "the production build succeeds"
    tool: bundler
    license: "varies by bundler, all MIT/Apache (free)"
    command: npm run build
    parser: exitcode
    threshold: exit == 0
    blocking: true
    docs: https://vite.dev/guide/build
    rationale: "Type-checking passing does not mean the bundle builds."

  - id: secrets
    tier: L0
    lane: inner
    claim: "no secrets or license keys committed"
    tool: gitleaks
    license: "MIT (free, commercial use OK)"
    command: gitleaks detect --no-banner --redact --report-format sarif --report-path {EVIDENCE_DIR}/gitleaks.sarif
    parser: sarif
    evidence: "{EVIDENCE_DIR}/gitleaks.sarif"
    threshold: total == 0
    blocking: true
    installHint: "brew install gitleaks"
    docs: https://github.com/gitleaks/gitleaks
    rationale: >
      Doubly important for frontend work: anything in client code ships to every
      visitor's browser.

  - id: tests
    tier: L1
    lane: inner
    claim: "the test suite passes"
    tool: vitest
    license: "MIT (free, commercial use OK)"
    command: npx vitest run --reporter=junit --outputFile={EVIDENCE_DIR}/junit.xml
    parser: junit
    evidence: "{EVIDENCE_DIR}/junit.xml"
    threshold: failed == 0
    blocking: true
    installHint: "npm i -D vitest"
    docs: https://vitest.dev/guide/
    rationale: "Replaces 'tests pass' with a junit file."

  - id: coverage-diff
    tier: L1
    lane: inner
    claim: "lines changed by this task are covered by tests"
    tool: vitest-coverage
    license: "MIT (free, commercial use OK)"
    command: npx vitest run --coverage --coverage.reporter=lcov --coverage.reportsDirectory={EVIDENCE_DIR}/cov
    parser: lcov-diff
    evidence: "{EVIDENCE_DIR}/cov/lcov.info"
    threshold: diffLineRate >= 0.80
    blocking: true
    ratchet: true
    installHint: "npm i -D @vitest/coverage-v8"
    docs: https://vitest.dev/guide/coverage
    rationale: "Diff-scoped so a legacy app can enforce a real bar immediately."

  - id: deps-audit
    tier: L2
    lane: outer
    claim: "no known-vulnerable dependencies"
    tool: osv-scanner
    license: "Apache-2.0 (free, commercial use OK)"
    command: osv-scanner --lockfile=package-lock.json --format sarif --output {EVIDENCE_DIR}/osv.sarif
    parser: sarif
    evidence: "{EVIDENCE_DIR}/osv.sarif"
    threshold: error == 0
    blocking: true
    installHint: "https://google.github.io/osv-scanner/installation/  (or use: npm audit --json)"
    docs: https://google.github.io/osv-scanner/
    rationale: >
      OSV-Scanner rather than Snyk: fully free, no account, no scan caps.

  - id: circular-deps
    tier: L2
    lane: inner
    claim: "no circular imports and no cross-boundary imports"
    tool: dependency-cruiser
    license: "MIT (free, commercial use OK)"
    command: npx depcruise src --validate .dependency-cruiser.js
    parser: exitcode
    threshold: exit == 0
    blocking: true
    installHint: "npm i -D dependency-cruiser && npx depcruise --init"
    docs: https://github.com/sverweij/dependency-cruiser
    rationale: >
      Architecture rules as configuration. An agent following local patterns will
      import across feature boundaries; this fails the build instead.

  - id: dead-code
    tier: L2
    lane: inner
    claim: "no unused exports, files, or dependencies"
    tool: knip
    license: "ISC (free, commercial use OK)"
    command: npx knip --reporter json > {EVIDENCE_DIR}/knip.json
    parser: jsonpath
    evidence: "{EVIDENCE_DIR}/knip.json"
    parserArgs:
      paths:
        issues: issues.length
    threshold: issues == 0
    blocking: false
    ratchet: true
    installHint: "npm i -D knip"
    docs: https://knip.dev/
    rationale: >
      Iterative AI edits accumulate orphaned exports and files fast, and nothing
      else in the pipeline notices.

  - id: bundle-budget
    tier: L2
    lane: inner
    claim: "bundle size is within budget"
    tool: size-limit
    license: "MIT (free, commercial use OK)"
    command: npx size-limit --json > {EVIDENCE_DIR}/size.json
    parser: jsonpath
    evidence: "{EVIDENCE_DIR}/size.json"
    parserArgs:
      paths:
        passed: "0.passed"
    threshold: passed == 1
    blocking: true
    installHint: "npm i -D size-limit @size-limit/preset-app"
    docs: https://github.com/ai/size-limit
    rationale: >
      Catches barrel imports that pull an entire component library into the
      bundle - the most common performance regression in AI-written frontend code.

  - id: mutation-diff
    tier: L3
    lane: outer
    claim: "tests on changed code are meaningful, not merely present"
    tool: stryker-js
    license: "Apache-2.0 (free, commercial use OK)"
    command: npx stryker run --since {BASE} --reporters json --jsonReporter.fileName {EVIDENCE_DIR}/mutation-report.json
    parser: stryker
    evidence: "{EVIDENCE_DIR}/mutation-report.json"
    threshold: mutationScore >= 60
    blocking: true
    ratchet: true
    installHint: "npm i -D @stryker-mutator/core @stryker-mutator/vitest-runner"
    docs: https://stryker-mutator.io/docs/stryker-js/introduction/
    rationale: >
      A test asserting only toBeTruthy() gives 100% coverage and near-zero
      mutation score. This is the gate that tells them apart.

  - id: leak-web
    tier: L3
    lane: outer
    claim: "no detached DOM nodes or retained components on changed routes"
    tool: memlab
    license: "MIT (free, commercial use OK)"
    command: npx memlab run --scenario e2e/leak/{SCENARIO}.js --work-dir {EVIDENCE_DIR}/memlab
    parser: memlab
    evidence: "{EVIDENCE_DIR}/memlab/leaks.json"
    threshold: leaks == 0
    blocking: true
    installHint: "npm i -D memlab"
    docs: https://facebook.github.io/memlab/
    rationale: >
      Free replacement for a manual DevTools heap investigation, and the only
      way to actually verify a leak fix. An LLM cannot observe heap retention.

  - id: a11y
    tier: L3
    lane: outer
    claim: "no WCAG A/AA violations on changed views"
    tool: axe-core
    license: "MPL-2.0 (free, commercial use OK)"
    command: npx playwright test --grep @a11y --reporter=junit
    parser: junit
    evidence: "{EVIDENCE_DIR}/a11y-junit.xml"
    threshold: failed == 0
    blocking: false
    installHint: "npm i -D @axe-core/playwright @playwright/test"
    docs: https://github.com/dequelabs/axe-core-npm
    rationale: "Free, deterministic, and catches what lint rules cannot see."

  - id: visual-regression
    tier: L3
    lane: outer
    claim: "no unintended visual changes"
    tool: playwright
    license: "Apache-2.0 (free, commercial use OK)"
    command: npx playwright test --grep @visual --reporter=junit
    parser: junit
    evidence: "{EVIDENCE_DIR}/visual-junit.xml"
    threshold: failed == 0
    blocking: false
    installHint: "npm i -D @playwright/test"
    docs: https://playwright.dev/docs/test-snapshots
    rationale: >
      Playwright's built-in toHaveScreenshot rather than Percy/Chromatic: free,
      local, no SaaS account, screenshots live in the repo.
