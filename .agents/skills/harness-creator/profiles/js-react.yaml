id: js-react
name: React (incl. Next.js)
extends: js-common
catalog: catalogs/defects-react.md

detect:
  requires:
    - glob: "package.json"
  signals:
    - kind: packageRef
      value: react
      weight: 10
    - kind: packageRef
      value: next
      weight: 6
    - kind: glob
      value: "**/*.tsx"
      weight: 5
    - kind: packageRef
      value: "@syncfusion/ej2-react-grids"
      weight: 4
  excludes:
    - packageRef: "@angular/core"

runtime:
  buildCommand: npm run build
  testCommand: npx vitest run

knowledge:
  - id: react-docs-hooks
    url: https://react.dev/reference/react/hooks
    topics: [hooks, rules-of-hooks]
    required: true
  - id: react-you-might-not-need-effect
    url: https://react.dev/learn/you-might-not-need-an-effect
    topics: [effects, derived-state, anti-patterns]
    required: true
  - id: react-synchronizing-with-effects
    url: https://react.dev/learn/synchronizing-with-effects
    topics: [effects, cleanup, StrictMode]
    required: true
  - id: react-hooks-eslint
    url: https://www.npmjs.com/package/eslint-plugin-react-hooks
    topics: [lint-rules, exhaustive-deps]
    required: true
  - id: jsx-a11y-rules
    url: https://github.com/jsx-eslint/eslint-plugin-jsx-a11y#supported-rules
    topics: [accessibility, rule-ids]
    required: true

skills:
  - id: react-development
    optional: true

gates:
  - id: lint
    tier: L0
    lane: inner
    claim: "no ESLint errors, with react-hooks and jsx-a11y at error"
    tool: eslint
    license: "MIT (free, commercial use OK)"
    command: npx eslint . --format json --output-file {EVIDENCE_DIR}/eslint.json
    parser: eslint-json
    evidence: "{EVIDENCE_DIR}/eslint.json"
    threshold: errors == 0
    blocking: true
    ratchet: true
    installHint: "npm i -D eslint eslint-plugin-react-hooks eslint-plugin-jsx-a11y"
    docs: https://www.npmjs.com/package/eslint-plugin-react-hooks
    rationale: >
      react-hooks/exhaustive-deps and rules-of-hooks must be 'error', not 'warn'.
      They catch the stale-closure and conditional-hook bugs that dominate
      AI-generated React, and a warning-level rule is a rule an agent ignores.

  - id: no-lint-suppression
    tier: L1
    lane: inner
    claim: "no unjustified eslint-disable added in this change"
    tool: git-grep
    license: "free (git)"
    command: ./scripts/check-suppressions.sh {BASE}
    parser: exitcode
    threshold: exit == 0
    blocking: true
    docs: https://eslint.org/docs/latest/use/configure/rules#disabling-rules
    rationale: >
      The most common evasion in AI-generated React: the model hits
      exhaustive-deps, cannot resolve it, and disables the rule. The script fails
      unless each disable added in the diff carries a justification comment.
