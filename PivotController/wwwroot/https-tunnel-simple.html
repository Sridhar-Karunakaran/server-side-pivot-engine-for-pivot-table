<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <title>Pivot Table — Data Server over HTTPS (Simple Tunnel Sample)</title>
    <!-- inline favicon (no server favicon.ico request -> no 404) -->
    <link rel="icon" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAEAAAABCAYAAAAfFcSJAAAADUlEQVR42mP8z8DwHwAFAAH/q842iQAAAABJRU5ErkJggg==" />
    <!-- Latest EJ2 packages -->
    <link rel="stylesheet" href="https://cdn.syncfusion.com/ej2/35.1.37/material.css" />
    <script src="https://cdn.syncfusion.com/ej2/35.1.37/dist/ej2.min.js" type="text/javascript"></script>
    <style>
        body { font-family: 'Segoe UI', sans-serif; margin: 24px; background: #fafafa; }
        h1 { font-size: 20px; font-weight: 600; }
        .meta { font-size: 13px; color: #555; margin: 8px 0 16px 0; }
        /* Explicit dimensions BEFORE first render — avoids the offsetWidth-null
           layout-refresh race when the grid renders before styles settle. */
        #PivotView { height: 420px; width: 100%; }
        .e-pivotview { display: block; }
    </style>
</head>
<body>
    <h1>Pivot Table — Data Server over HTTPS</h1>
    <div class="meta" id="Meta">Connecting…</div>

    <div id="PivotView"></div>

    <script type="text/javascript">
        (function () {
            // Same-origin HTTPS endpoint: this page is served BY the Data Server,
            // so its own protocol/host point straight back at the certified API.
            // No hard-coded host -> works through any tunnel/proxy unchanged.
            var endpoint = window.location.protocol + '//' + window.location.host + '/api/pivot/post';
            document.getElementById('Meta').innerHTML =
                'Connected to: <code>' + endpoint + '</code> · ' +
                (window.location.protocol === 'https:' ? 'TLS/certificate-secured' : 'plain HTTP') +
                ' · index <code>Sales-Json</code> — open the field list to build your view.';

            // Per-request index routing: copy the ?index= query into the POST body
            // (the Data Server routes each pivot request by the body field).
            var index = /[?&]index=([^&]+)/.exec(window.location.search);
            index = index ? decodeURIComponent(index[1]) : 'Sales-Json';

            var realOpen = XMLHttpRequest.prototype.open;
            var realSend = XMLHttpRequest.prototype.send;
            XMLHttpRequest.prototype.open = function (method, url) {
                this._isPivotPost = String(url).indexOf('/api/pivot/post') > -1;
                this._pivotUrl = String(url);
                return realOpen.apply(this, arguments);
            };
            XMLHttpRequest.prototype.send = function (body) {
                if (this._isPivotPost && body) {
                    try {
                        var parsed = JSON.parse(body);
                        if (parsed && parsed.dataSourceSettings) {
                            parsed.index = index;
                            arguments[0] = JSON.stringify(parsed);
                        }
                    } catch (e) { /* not JSON; leave as-is */ }
                }
                return realSend.apply(this, arguments);
            };

            // Empty field ARRAYS (not omitted): EJ2 Server mode iterates
            // rows/columns/values/filters internally — omitted arrays are the
            // "Cannot read properties of undefined (reading 'sort')" crash.
            // No fields are defined: connect + field list only.
            function render() {
                var pivotGridObj = new ej.pivotview.PivotView({
                    dataSourceSettings: {
                        url: endpoint,
                        mode: 'Server',
                        type: 'JSON',
                        expandAll: false,
                        rows: [],
                        columns: [],
                        values: [],
                        filters: []
                    },
                    showFieldList: true,
                    height: '420px',
                    width: '100%'
                });
                pivotGridObj.appendTo('#PivotView');
            }

            if (document.readyState === 'loading') {
                document.addEventListener('DOMContentLoaded', render);
            } else {
                render();
            }
        })();
    </script>
</body>
</html>
